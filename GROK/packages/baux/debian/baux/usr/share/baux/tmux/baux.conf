# BAUX tmux configuration
# Unified keymap: Alt for tmux, identical everywhere

# Set prefix to Alt (Mod1)
set -g prefix M-a
unbind C-b
bind M-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf

# Window management (Alt + number)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# Pane navigation (Alt + hjkl)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane movement (Alt + Shift + hjkl)
bind -n M-H swap-pane -s '{left-of}'
bind -n M-J swap-pane -s '{down-of}'
bind -n M-K swap-pane -s '{up-of}'
bind -n M-L swap-pane -s '{right-of}'

# Window operations
bind -n M-t new-window
bind -n M-w kill-window
bind -n M-, previous-window
bind -n M-. next-window

# Status bar
set -g status-bg colour237
set -g status-fg colour223
set -g status-left '[#S] '
set -g status-right '#[fg=colour233,bg=colour241,bold] %H:%M '

# Vi mode
setw -g mode-keys vi

# Mouse support
set -g mouse on

# Resurrect
run-shell ~/.tmux/plugins/resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/continuum/continuum.tmux