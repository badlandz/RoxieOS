# Roxanne Cyberdeck tmux — Immortal + Unixporn Edition v0.2.1
# Prefix: C-Space
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g escape-time 0
set -g status-interval 5
set -g status on
set -g status-position top
set -g status-justify left

# Prefix
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Your perfect keybinds
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5
bind -n M-% split-window -h -c "#{pane_current_path}"
bind -n M-\" split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#W" "rename-window '%%'"
bind . command-prompt -I "#S" "rename-session '%%'"
bind r source-file "$BAUX_HOME/tmux/baux.conf" \; display "Roxanne reloaded!"

# IMMORTAL SSH PANES
set -g remain-on-exit on
set -g remain-on-exit failed
set -g pane-border-status top
set -g pane-border-format "#[fg=#cc241d,bold] #P: #{pane_current_command} #{?pane_dead, ← DEAD →, #[fg=#98971a]LIVE#[default]} "

# TPM + resurrect + continuum (BAUX-managed for mesh consistency)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '/usr/local/share/baux/tmux-plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Simple, reliable resurrect directory
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'

# Essential processes only (keep it simple)
set -g @resurrect-processes 'ssh nvim btop "*baux*"'

# Auto-save every 10 minutes (reasonable balance)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Error handling for resurrect
set -g @resurrect-hook-pre-restore 'mkdir -p ~/.tmux/resurrect'
set -g @resurrect-hook-post-restore 'tmux display-message "BAUX sessions restored"'

run '/usr/local/share/baux/tmux-plugins/tpm/tpm'

# Roxanne status bar — Gruvbox Dark Theme
set -g status-left "#[fg=#282828,bg=#cc241d,bold] ROXANNE #[fg=#cc241d,bg=#282828] on #[fg=#458588,bold]#H #[default]"
set -g status-right "#[fg=#d79921]#{?client_prefix,PREFIX ,}#[fg=#98971a]%a %H:%M"
set -g status-center "#[fg=#ebdbb2,bold]#{b:pane_current_path}#[default]"
set -g status-style bg=#282828,fg=#ebdbb2
setw -g window-status-current-style bg=#cc241d,fg=#282828,bold

# User overrides
if-shell '[ -f /etc/baux/tmux.local.conf ]' 'source-file /etc/baux/tmux.local.conf'

# Enter respawns dead panes
bind-key Enter respawn-pane -k \; display "Reconnecting dead pane..."

